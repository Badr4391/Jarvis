[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "Persoenlicher Assistent fuer Leben, Trading und Maerkte - local-first, mit Stimme."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Badr" }]
keywords = ["assistant", "trading", "journal", "briefing", "voice", "local-first"]

# Der Kern laeuft mit der Standardbibliothek. Alles andere ist Komfort.
dependencies = []

[project.optional-dependencies]
pretty  = ["rich>=13.0"]                 # huebschere Tabellen im Terminal
config  = ["PyYAML>=6.0"]                # config/jarvis.yaml lesen
voice   = ["faster-whisper>=1.0", "pyttsx3>=2.90"]
dev     = ["pytest>=8.0", "ruff>=0.5"]
all     = ["rich>=13.0", "PyYAML>=6.0", "faster-whisper>=1.0", "pyttsx3>=2.90"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jarvis.api" = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
